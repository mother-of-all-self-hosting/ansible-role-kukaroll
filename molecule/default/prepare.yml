---
- name: Prepare kukaroll Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for kukaroll Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for kukaroll Molecule tests preparation
      ansible.builtin.package:
        name:
          - git
          - python3-requests
        state: present

    - name: Ensure Docker is installed for kukaroll Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker

    # A bare repository stands in for the forge, and a clone of it is the checkout kukaroll deploys.
    # Both get the first commit; verify.yml pushes the next ones.
    - name: Ensure the project's repository and checkout exist
      ansible.builtin.shell:
        cmd: |
          set -eu
          git init --quiet --bare --initial-branch=main {{ kukaroll_molecule_project_origin }}
          work="$(mktemp -d)"
          git clone --quiet {{ kukaroll_molecule_project_origin }} "$work"
          echo 1 > "$work/version"
          git -C "$work" add version
          git -C "$work" -c user.name=molecule -c user.email=molecule@example.com commit --quiet -m 1
          git -C "$work" push --quiet origin main
          rm -rf "$work"
          git clone --quiet {{ kukaroll_molecule_project_origin }} {{ kukaroll_molecule_project_checkout }}
        creates: "{{ kukaroll_molecule_project_checkout }}"
