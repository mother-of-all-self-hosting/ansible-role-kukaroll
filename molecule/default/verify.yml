---
# What this suite is guarding against
#
# The receiver answering HTTP says little: it would answer just the same if nothing ever acted on the spool files it creates.
# So the suite follows a push all the way:
# a signed webhook reaches the receiver, the project's path unit starts the executor, the checkout moves to the new commit and the project's deploy hook runs there.
# It also checks that unsigned webhooks are refused, and that stopping the deploys target pauses deploys without losing a push.

- name: Verify kukaroll
  hosts: all
  become: true
  gather_facts: false

  vars:
    kukaroll_molecule_base_url: http://127.0.0.1:8080
    kukaroll_molecule_project: myapp

    # Sends a push webhook the way Forgejo does, and prints the HTTP status.
    # Arguments: the URL, and the secret to sign the body with.
    # Done in Python rather than with the uri module, which would turn a JSON body into a dictionary and re-serialize it,
    # so that the signature no longer matches the bytes sent.
    kukaroll_molecule_webhook_sender: |
      import hashlib, hmac, sys, urllib.error, urllib.request

      url, secret = sys.argv[1], sys.argv[2]
      body = b'{"ref":"refs/heads/main","deleted":false}'
      request = urllib.request.Request(url, data=body, method="POST", headers={
          "Content-Type": "application/json",
          "X-Forgejo-Event": "push",
          "X-Forgejo-Signature": hmac.new(secret.encode(), body, hashlib.sha256).hexdigest(),
      })
      try:
          with urllib.request.urlopen(request, timeout=10) as response:
              print(response.status)
      except urllib.error.HTTPError as error:
          print(error.code)

    kukaroll_verify_units:
      - kukaroll-receiver.service
      - kukaroll-deploys.target
      - kukaroll-execute@myapp.path

  tasks:
    - name: Verify that kukaroll works
      block:
        # Only for the image this role installs: variables loaded this way outrank the scenario's group_vars.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: kukaroll_defaults

        - name: Wait for the kukaroll systemd units to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: kukaroll_services
          until: kukaroll_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ kukaroll_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a wall of systemd unit properties.
          failed_when: false

        - name: Assert the kukaroll systemd units are active
          ansible.builtin.assert:
            that: kukaroll_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every unit is active:
              {{ dict(kukaroll_verify_units | zip(kukaroll_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd unit is active"

        - name: Retrieve the kukaroll systemd units log for debugging
          when: kukaroll_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ kukaroll_verify_units + ['kukaroll-execute@myapp.service'] }}"

        - name: Inspect the running kukaroll receiver container
          ansible.builtin.command:
            argv: [docker, container, inspect, kukaroll-receiver]
          register: kukaroll_container_info
          changed_when: false

        - name: Assert the receiver runs the image this role installs
          vars:
            kukaroll_molecule_expected_image: "{{ kukaroll_defaults.kukaroll_container_image_registry_prefix_upstream_default }}devture/kukaroll:{{ kukaroll_defaults.kukaroll_version }}"
            kukaroll_molecule_container: "{{ kukaroll_container_info.stdout | from_json | first }}"
          ansible.builtin.assert:
            that:
              - kukaroll_molecule_container.State.Running
              - kukaroll_molecule_container.Config.Image == kukaroll_molecule_expected_image
            fail_msg: "The receiver runs {{ kukaroll_molecule_container.Config.Image }}, not {{ kukaroll_molecule_expected_image }}"
            success_msg: "The receiver runs {{ kukaroll_molecule_expected_image }}"

        # ----------------------------------------------------------------------
        # The catch-up on start deploys the checkout's current commit
        # ----------------------------------------------------------------------

        - name: Read the first commit
          ansible.builtin.command:
            argv: [git, -C, "{{ kukaroll_molecule_project_origin }}", rev-parse, main]
          register: kukaroll_first_commit
          changed_when: false

        # Starting the receiver and the deploys target requests a deploy of every project, so the first commit gets deployed with no webhook.
        - name: Wait for the first commit to be deployed (up to 120s)
          ansible.builtin.command:
            argv: [git, -C, "{{ kukaroll_molecule_project_checkout }}", rev-parse, refs/kukaroll/deployed]
          register: kukaroll_deployed
          changed_when: false
          failed_when: false
          until: kukaroll_deployed.stdout == kukaroll_first_commit.stdout
          retries: 24
          delay: 5

        - name: Assert the first commit was deployed
          ansible.builtin.assert:
            that: kukaroll_deployed.stdout == kukaroll_first_commit.stdout
            fail_msg: "The catch-up did not deploy {{ kukaroll_first_commit.stdout }} (deployed: {{ kukaroll_deployed.stdout | default('nothing') }})"
            success_msg: "The catch-up deployed {{ kukaroll_first_commit.stdout }}"

        # ----------------------------------------------------------------------
        # Webhooks that must not deploy anything
        # ----------------------------------------------------------------------

        - name: Send a webhook signed with a wrong secret
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "{{ kukaroll_molecule_webhook_sender }}"
              - "{{ kukaroll_molecule_base_url }}/hooks/{{ kukaroll_molecule_project }}"
              - not-the-secret
          register: kukaroll_webhook_wrong_secret
          changed_when: false

        - name: Send a webhook for a project that does not exist
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "{{ kukaroll_molecule_webhook_sender }}"
              - "{{ kukaroll_molecule_base_url }}/hooks/no-such-project"
              - "{{ kukaroll_projects.myapp.webhook_secret }}"
          register: kukaroll_webhook_unknown_project
          changed_when: false

        - name: Assert the receiver refused both
          ansible.builtin.assert:
            that:
              - kukaroll_webhook_wrong_secret.stdout == '401'
              - kukaroll_webhook_unknown_project.stdout == '404'
            fail_msg: "Expected 401 and 404, got {{ kukaroll_webhook_wrong_secret.stdout }} and {{ kukaroll_webhook_unknown_project.stdout }}"
            success_msg: "The receiver refused a wrongly signed webhook (401) and one for an unknown project (404)"

        # ----------------------------------------------------------------------
        # A signed push webhook deploys the new commit
        # ----------------------------------------------------------------------

        - name: Push a second commit and send its webhook
          ansible.builtin.include_tasks: tasks/push.yml
          vars:
            kukaroll_molecule_commit_message: "2"

        - name: Wait for the second commit to be deployed (up to 120s)
          ansible.builtin.command:
            cmd: "cat {{ kukaroll_molecule_project_deploy_marker }}"
          register: kukaroll_deploy_marker
          changed_when: false
          failed_when: false
          until: kukaroll_deploy_marker.stdout == kukaroll_pushed_commit.stdout
          retries: 24
          delay: 5

        # The marker is written by the project's deploy hook, which runs in the checkout after it has moved: it proves both.
        - name: Assert the deploy hook ran at the second commit
          ansible.builtin.assert:
            that: kukaroll_deploy_marker.stdout == kukaroll_pushed_commit.stdout
            fail_msg: "The deploy hook did not run at {{ kukaroll_pushed_commit.stdout }} (it last ran at: {{ kukaroll_deploy_marker.stdout | default('never') }})"
            success_msg: "The webhook deployed {{ kukaroll_pushed_commit.stdout }}"

        # ----------------------------------------------------------------------
        # Stopping the deploys target pauses deploys, and keeps the push
        # ----------------------------------------------------------------------

        - name: Pause deploys
          ansible.builtin.systemd_service:
            name: kukaroll-deploys.target
            state: stopped

        - name: Push a third commit and send its webhook while paused
          ansible.builtin.include_tasks: tasks/push.yml
          vars:
            kukaroll_molecule_commit_message: "3"

        - name: Give a deploy the time to start, if one wrongly would
          ansible.builtin.pause:
            seconds: 10

        - name: Check the spool file and the deployed commit while paused
          ansible.builtin.stat:
            path: "/kukaroll/spool/{{ kukaroll_molecule_project }}"
          register: kukaroll_spool_file

        - name: Read the commit the deploy hook last ran at while paused
          ansible.builtin.command:
            cmd: "cat {{ kukaroll_molecule_project_deploy_marker }}"
          register: kukaroll_deploy_marker_paused
          changed_when: false

        - name: Assert nothing was deployed while paused, and the push is pending
          ansible.builtin.assert:
            that:
              - kukaroll_spool_file.stat.exists
              - kukaroll_deploy_marker_paused.stdout != kukaroll_pushed_commit.stdout
            fail_msg: "Deploys were not paused, or the push was lost (spool file present: {{ kukaroll_spool_file.stat.exists }})"
            success_msg: "Nothing was deployed while paused, and the push is pending"

        - name: Resume deploys
          ansible.builtin.systemd_service:
            name: kukaroll-deploys.target
            state: started

        - name: Wait for the third commit to be deployed (up to 120s)
          ansible.builtin.command:
            cmd: "cat {{ kukaroll_molecule_project_deploy_marker }}"
          register: kukaroll_deploy_marker
          changed_when: false
          failed_when: false
          until: kukaroll_deploy_marker.stdout == kukaroll_pushed_commit.stdout
          retries: 24
          delay: 5

        - name: Assert the pending push was deployed after resuming
          ansible.builtin.assert:
            that: kukaroll_deploy_marker.stdout == kukaroll_pushed_commit.stdout
            fail_msg: "Resuming did not deploy {{ kukaroll_pushed_commit.stdout }} (the deploy hook last ran at: {{ kukaroll_deploy_marker.stdout | default('never') }})"
            success_msg: "Resuming deployed {{ kukaroll_pushed_commit.stdout }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "kukaroll_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little.
            - name: Sample the receiver's restart counter
              ansible.builtin.systemd_service:
                name: kukaroll-receiver.service
              register: kukaroll_restarts_before

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to tick at least once inside the window.
            - name: Watch the receiver for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the receiver's restart counter again
              ansible.builtin.systemd_service:
                name: kukaroll-receiver.service
              register: kukaroll_restarts_after

            - name: Assert the receiver did not restart while it was up
              ansible.builtin.assert:
                that:
                  - kukaroll_restarts_after.status.NRestarts == kukaroll_restarts_before.status.NRestarts
                  - kukaroll_restarts_after.status.ActiveState == 'active'
                fail_msg: "The receiver restarted while it was supposedly up ({{ kukaroll_restarts_before.status.NRestarts }} -> {{ kukaroll_restarts_after.status.NRestarts }} restarts)"
                success_msg: "The receiver did not restart over 45 seconds of watching ({{ kukaroll_restarts_after.status.NRestarts }} restarts so far)"

        - name: Show the kukaroll verification summary
          ansible.builtin.debug:
            msg:
              - "kukaroll systemd: {% for unit, state in kukaroll_verify_units | zip(kukaroll_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "kukaroll version: {{ kukaroll_defaults.kukaroll_version | regex_replace('^v', '') }}"
              - "kukaroll deploys: catch-up, signed webhook, and a webhook received while paused"

      rescue:
        # Whatever went wrong, the reason is almost always in the units' logs.
        - name: Retrieve the kukaroll systemd units log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=kukaroll-receiver.service --unit=kukaroll-execute@myapp.service
          register: kukaroll_service_log
          changed_when: false

        - name: Show the kukaroll systemd units log
          ansible.builtin.debug:
            var: kukaroll_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "kukaroll verification failed. The systemd units log is printed above."
